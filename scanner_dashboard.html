<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner Terminal — Enterprise</title>
<style>
:root{
  --bg:#0B0F17; --bg2:#0e1420; --card:#1E293B; --card2:#172033; --line:#243044;
  --ink:#F1F5F9; --ink2:#94A3B8; --muted:#64748B;
  --up:#10B981; --down:#EF4444; --warn:#F59E0B; --info:#38BDF8; --brand:#6366F1;
  --up-bg:rgba(16,185,129,.12); --down-bg:rgba(239,68,68,.12); --warn-bg:rgba(245,158,11,.12); --info-bg:rgba(56,189,248,.12);
  --radius:14px; --radius-sm:9px; --shadow:0 1px 0 rgba(255,255,255,.03), 0 8px 24px rgba(0,0,0,.35);
  --nav-w:230px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;max-width:100%}
body{overflow-x:clip}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.tscroll table{min-width:600px}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(1200px 600px at 80% -10%,rgba(99,102,241,.10),transparent 60%),var(--bg);
  color:var(--ink); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.pos{color:var(--up)} .neg{color:var(--down)} .neu{color:var(--warn)}

/* layout */
.app{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100vh}
nav.side{
  background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--line);
  padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--info));display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
.brand .t{font-weight:800;letter-spacing:.02em;font-size:15px}
.brand .t small{display:block;font-weight:500;color:var(--muted);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.navbtn{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--ink2);font-weight:600;cursor:pointer;border:1px solid transparent;transition:.15s}
.navbtn:hover{background:var(--card2);color:var(--ink)}
.navbtn.on{background:var(--card);color:var(--ink);border-color:var(--line)}
.navbtn .ic{width:18px;text-align:center;opacity:.9}
.navbtn .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:1px 8px}
.side .spacer{flex:1}
.livebox{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;background:var(--card2);font-size:12px}
.livedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);margin-right:7px;box-shadow:0 0 0 0 rgba(16,185,129,.6);animation:pulse 2s infinite}
.livedot.stale{background:var(--down);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}

main{padding:22px 26px 60px;max-width:1500px;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.topbar h1{font-size:21px;font-weight:800;letter-spacing:-.01em}
.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.tb-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--card2);color:var(--ink2)}
.chip.live .d{width:7px;height:7px;border-radius:50%;background:var(--up);animation:pulse 2s infinite}
.chip.live.stale .d{background:var(--down);animation:none}

.page{display:none;animation:fade .25s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* cards + grid */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.cards3{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.cards2{grid-template-columns:repeat(auto-fill,minmax(430px,1fr))}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.card h3{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin-bottom:12px}
.grouphdr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 2px 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grouphdr .gt{font-size:15px;font-weight:800;letter-spacing:-.01em}
.grouphdr .gs{font-size:12px;color:var(--muted)}
.kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.kpi .sub{font-size:12px;color:var(--ink2);margin-top:3px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 9px;border-radius:20px;border:1px solid transparent}
.badge.call{color:var(--up);background:var(--up-bg);border-color:rgba(16,185,129,.3)}
.badge.put{color:var(--down);background:var(--down-bg);border-color:rgba(239,68,68,.3)}
.badge.wait{color:var(--warn);background:var(--warn-bg);border-color:rgba(245,158,11,.3)}
.badge.info{color:var(--info);background:var(--info-bg);border-color:rgba(56,189,248,.3)}
.badge.mut{color:var(--ink2);background:var(--card2);border-color:var(--line)}

/* tables */
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:11px 12px;border-bottom:1px solid rgba(36,48,68,.5);text-align:right;font-size:13px;white-space:nowrap}
tbody tr:hover td{background:rgba(99,102,241,.06)}
.tk{font-weight:700}
.sub2{color:var(--muted);font-size:11px}
.btn{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--ink2);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--brand);color:var(--ink)}
.btn.sell{border-color:rgba(239,68,68,.35);color:#fca5a5}
.btn.sell:hover{background:var(--down-bg)}

/* option card */
.ocard{position:relative;overflow:hidden}
.ocard .rail{position:absolute;left:0;top:0;bottom:0;width:4px}
.ocard.call .rail{background:var(--up)} .ocard.put .rail{background:var(--down)}
.ohead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ohead .tkr{font-size:19px;font-weight:800;letter-spacing:-.01em}
.ohead .strike{font-size:13px;color:var(--ink2);margin-top:2px}
.score{flex:0 0 auto;text-align:center;border:2px solid;border-radius:12px;padding:6px 10px;min-width:62px}
.score .n{font-size:22px;font-weight:800;line-height:1}
.score .l{font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.okv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.okv .b{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
.okv .b span{display:block;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.okv .b b{font-size:15px;font-weight:800}
.metrics{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.metrics .m{font-size:11px;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:4px 8px}
.metrics .m b{color:var(--ink)}
.thesis{font-size:12.5px;color:var(--ink2);line-height:1.5;border-top:1px solid var(--line);padding-top:11px}
.thesis b{color:var(--ink)}
.timing{display:flex;align-items:center;gap:8px;margin-top:11px;font-size:11.5px;padding:7px 10px;border-radius:8px;border:1px solid}

/* news */
.newscard{display:flex;gap:12px;align-items:flex-start}
.newscard .dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;margin-top:6px}
.newscard .h{font-weight:700;font-size:14px}
.newscard .meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.newscard .body{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.5}
.breaking{border-left:3px solid var(--warn)}
.impact-dd{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}
.impact-dd summary{cursor:pointer;font-size:11.5px;font-weight:700;color:var(--info);list-style:none;user-select:none}
.impact-dd summary::-webkit-details-marker{display:none}
.impact-dd summary::before{content:'▸ ';color:var(--muted)}
.impact-dd[open] summary::before{content:'▾ '}
.imwrap{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.imrow{display:grid;grid-template-columns:120px 92px 1fr;gap:10px;align-items:baseline;font-size:12px;padding:6px 0;border-bottom:1px dotted var(--line)}
.imtk{font-weight:700}
.imbias{font-size:10.5px;font-weight:800;letter-spacing:.03em;border-radius:5px;padding:2px 7px;text-align:center}
.imbias.bullish{color:var(--up);background:var(--up-bg)}
.imbias.bearish{color:var(--down);background:var(--down-bg)}
.imbias.neutral{color:var(--warn);background:var(--warn-bg)}
.imreason{color:var(--ink2);line-height:1.45}
@media(max-width:620px){.imrow{grid-template-columns:1fr;gap:3px}}
.bbanner{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(239,68,68,.20),transparent 70%);border-bottom:1px solid var(--down);padding:10px 16px;font-size:13px;font-weight:650;position:sticky;top:0;z-index:50}
.bbanner .tag{flex:0 0 auto;background:var(--down);color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:20px;animation:pulse 2s infinite}
.bbanner .htxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bbanner .x{flex:0 0 auto;margin-left:auto;cursor:pointer;color:var(--ink2);border:1px solid var(--line);border-radius:7px;padding:4px 10px;min-height:32px}
.bbanner[hidden]{display:none}
.senthero{display:flex;align-items:center;gap:16px}
.senthero .big{font-size:30px;font-weight:800}
.gauge{flex:1;height:10px;border-radius:20px;background:linear-gradient(90deg,var(--down),var(--warn),var(--up));position:relative}
.gauge .pin{position:absolute;top:-4px;width:4px;height:18px;border-radius:3px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.6)}

/* calendar */
.filterbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
select{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;min-width:180px}
.catrow{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:13px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);margin-bottom:10px}
.catrow .date{text-align:center;border-right:1px solid var(--line);padding-right:12px}
.catrow .date .d{font-size:20px;font-weight:800;line-height:1}
.catrow .date .m{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.catrow .main .t{font-weight:700}
.catrow .main .setup{font-size:12px;color:var(--ink2);margin-top:3px}
.catrow .impact{text-align:right}
.empty{color:var(--muted);font-size:13px;padding:22px;text-align:center}

/* ---- mobile: sticky top pill nav ---- */
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  nav.side{position:sticky;top:0;left:0;right:0;height:auto;flex-direction:row;align-items:center;gap:6px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;border-right:none;border-bottom:1px solid var(--line);
    z-index:30;padding:8px 10px;background:var(--bg2)}
  nav.side .brand{padding:0 6px 0 2px;flex:0 0 auto}
  nav.side .brand .t small{display:none}
  nav.side .spacer,nav.side .livebox{display:none}
  .navbtn{flex:0 0 auto;min-height:44px;flex-direction:row;gap:7px;font-size:13px;padding:10px 15px;
    white-space:nowrap;border:1px solid var(--line);border-radius:22px;background:var(--card2)}
  .navbtn.on{background:var(--card);border-color:var(--brand);color:var(--ink)}
  .navbtn .cnt{display:inline}
  main{padding:16px 14px 60px}
  .topbar h1{font-size:18px}
}
/* ---- mobile: single-column grids + 44px touch targets ---- */
@media(max-width:768px){
  .cards2,.cards3{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .okv{grid-template-columns:repeat(3,1fr)}
  .btn{min-height:44px;padding:9px 13px}
  select{min-height:44px}
  .catrow{grid-template-columns:60px 1fr}
  .catrow .impact{grid-column:1/-1;text-align:left}
}
@media(max-width:480px){
  .kpis{grid-template-columns:1fr}
  .okv{grid-template-columns:1fr 1fr}
  .senthero{flex-wrap:wrap}
  .obig{font-size:16px}
}
</style>

const $ = s => document.querySelector(s);
const fmt$ = v => (v<0?'-$':'$')+Math.abs(+v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0 = v => (v<0?'-$':'$')+Math.abs(+v||0).toLocaleString(undefined,{maximumFractionDigits:0});
const pct = v => ((v>0?'+':'')+(+v||0).toFixed(2)+'%');
const cls = v => v>0.001?'pos':(v<-0.001?'neg':'');
const pxDate = d => { try{const [y,m,da]=d.split('-');return {d:da,m:['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][+m-1]};}catch(e){return {d:'--',m:''};} };
const dteOf = exp => { if(!exp) return null; return Math.ceil((new Date(exp+'T20:00:00Z')-Date.now())/86400000); };
const dtePill = exp => { const d=dteOf(exp); if(d==null) return ''; const short=d<=7; const c=short?'var(--warn)':'var(--info)', bg=short?'var(--warn-bg)':'var(--info-bg)'; return `<span class="badge" style="color:${c};background:${bg};border-color:${c}">${d} DTE</span>`; };
const edgeBadge = e => { if(e==null) return ''; const c=e>0?'var(--up)':e<0?'var(--down)':'var(--muted)', bg=e>0?'var(--up-bg)':e<0?'var(--down-bg)':'var(--card2)'; return `<span class="badge" style="color:${c};background:${bg};border-color:${c}" title="Edge: low HV-rank +10, in-band delta +10, volume surge +10, crush risk -10 (separate from Confluence)">EDGE ${e>0?'+':''}${e}</span>`; };
// work-week boundaries (Mon–Fri) from the client's current date; weeks end Sunday night
function weekBounds(){ const n=new Date(); n.setHours(0,0,0,0); const thisSun=new Date(n); thisSun.setDate(n.getDate()+((7-n.getDay())%7)); thisSun.setHours(23,59,59,999); const nextSun=new Date(thisSun); nextSun.setDate(thisSun.getDate()+7); return {thisSun,nextSun}; }
function weekBucket(exp){ if(!exp) return 2; const {thisSun,nextSun}=weekBounds(); const e=new Date(exp+'T16:00:00'); if(e<=thisSun) return 0; if(e<=nextSun) return 1; return 2; }
const fmtMD = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
const scoreColor = s => s>=70?'var(--up)':s>=50?'var(--warn)':'var(--down)';

/* ---------- Options page ---------- */
function optionTiming(o){
  if(o.filtered) return ['FILTERED — over $300 cap','var(--down)','var(--down-bg)'];
  if(!o.enterFrom || !o.enterTo){
    if(o.trailActive) return ['TRAILING ARMED — 20% below peak · uncapped ▲','var(--up)','var(--up-bg)'];
    return ['OPEN — hard −50% until +30% arms the trail'+(o.exitBy?' · time-exit '+o.exitBy:''),'var(--info)','var(--info-bg)'];
  }
  const now=new Date(), from=new Date(o.enterFrom+'T00:00:00'), to=new Date(o.enterTo+'T23:59:59');
  if(now<from) return ['WAIT — entry window opens '+o.enterFrom,'var(--warn)','var(--warn-bg)'];
  if(now>to) return ['WINDOW PASSED — inside the crush zone','var(--down)','var(--down-bg)'];
  return ['ENTER — inside the window, before IV ramp peaks','var(--up)','var(--up-bg)'];
}
function optionCard(o){

        <div class="strike mono">$${o.strike} strike · exp ${o.exp} · ${o.contracts}×</div></div>

      ['Entry', o.entry!=null?fmt$(o.entry):null],
      ['Peak Gain', o.peakPct!=null?`<span class="${cls(o.peakPct)}">${pct(o.peakPct)}</span>`:null],
      ['Trail Stop', o.trailStop!=null?fmt$(o.trailStop):(o.stop!=null?fmt$(o.stop):null)],
      ['Total Cost', o.cost!=null?fmt0(o.cost):null],
      ['Spot', o.spot!=null?`<span data-spot="${o.ticker}">${fmt$(o.spot)}</span>`:null],
      ['Upside', '<span class="pos">Uncapped ▲</span>']
    ].filter(x=>x[1]!=null).map(([l,v])=>`<div class="b"><span>${l}</span><b class="mono">${v}</b></div>`).join('')}</div>
    <div class="metrics">
      ${o.iv!=null?`<span class="m">IV <b>${Math.round(o.iv*100)}%</b></span>`:''}
      ${o.ivRank!=null?`<span class="m">IV Rank <b style="color:${o.ivRank>=0.7?'var(--down)':o.ivRank>=0.4?'var(--warn)':'var(--up)'}">${Math.round(o.ivRank*100)}</b></span>`:''}
      ${o.delta!=null?`<span class="m">Δ <b>${(+o.delta).toFixed(2)}</b></span>`:''}
      ${o.thetaPct!=null?`<span class="m">Θ/day <b class="neg">${o.thetaPct}%</b></span>`:''}
      ${o.vwapDelta!=null?`<span class="m">VWAP Δ <b class="${cls(o.vwapDelta)}">${pct(o.vwapDelta)}</b></span>`:''}
      ${o.pctB!=null?`<span class="m">%B <b>${(+o.pctB).toFixed(2)}</b></span>`:''}
      ${o.oi!=null?`<span class="m">OI <b>${(o.oi||0).toLocaleString()}</b></span>`:''}
      ${o.spreadPct!=null?`<span class="m">Spread <b>${o.spreadPct}%</b></span>`:''}
      ${(o.reqMove!=null&&o.em!=null)?`<span class="m">Move need/impl <b style="color:${emCover>1.2?'var(--down)':'var(--warn)'}">${o.reqMove}% / ${o.em}%</b></span>`:''}

function renderOptions(){

  const tech=[
    ['SPY Spot', `<span class="mono" data-spot="SPY">${fmt$(t.spySpot)}</span>`, `<span class="${cls(t.spyDayPct)}">${pct(t.spyDayPct)} today</span>`],

  // group open contracts by expiry horizon; sort in-profit by highest %, others closest to breakeven
  const withDte=(DATA.options||[]).map(o=>({o,dte:dteOf(o.exp),bucket:weekBucket(o.exp)})).filter(x=>x.dte==null||x.dte>=0);

    const prof=arr.filter(x=>(x.o.plPct||0)>0).sort((a,b)=>(b.o.plPct||0)-(a.o.plPct||0));
    const rest=arr.filter(x=>(x.o.plPct||0)<=0).sort((a,b)=>(b.o.plPct||0)-(a.o.plPct||0));
    return prof.concat(rest);
  };
  const {thisSun,nextSun}=weekBounds();

  ];
  const sections=groups.map(([title,sub,fn])=>{

    return `<div style="margin-bottom:16px"><div class="grouphdr"><span class="gt">${title}</span><span class="gs">${sub} · ${g.length} open contract${g.length===1?'':'s'} (${fmt0(alloc)} allocated)</span></div>${body}</div>`;

    <span class="dot" style="background:${dot(i.sentiment)}"></span>
    <div style="flex:1;min-width:0"><div class="h">${i.headline}</div>
      <div class="meta">${i.ticker?`<b>${i.ticker}</b> · `:''}${i.source||''} · ${i.time||''} · <span class="badge ${i.sentiment==='bullish'?'call':i.sentiment==='bearish'?'put':'wait'}">${(i.sentiment||'neutral').toUpperCase()}</span></div>
      ${i.body?`<div class="body">${i.body}</div>`:''}
      ${impactDD(i)}
      ${i.url?`<a href="${i.url}" target="_blank" rel="noopener" class="sub2" style="display:inline-block;margin-top:7px">read source ↗</a>`:''}
    </div></div>`;
  const bcards=breaking.map(i=>newsCard(i,true)).join('') || `<div class="empty">No breaking alerts.</div>`;
  const feedRows=feed.map(i=>newsCard(i,false)).join('') || `<div class="empty">No headlines.</div>`;
  return `<div class="card" style="margin-bottom:16px"><h3>Overall Market News Sentiment</h3>
    <div class="senthero"><div class="big" style="color:${senthue}">${n.sentimentLabel||(s>=0.6?'Bullish':s<=0.4?'Bearish':'Neutral')}</div>
      <div class="gauge"><div class="pin" style="left:calc(${Math.max(2,Math.min(98,s*100))}% - 2px)"></div></div>
      <div class="mono" style="color:var(--muted)">${Math.round(s*100)}/100</div></div></div>
  <h3 style="color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase;margin:6px 2px 12px">High-Impact Breaking Alerts</h3>
  <div class="grid cards2" style="margin-bottom:20px">${bcards}</div>
  <h3 style="color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase;margin:6px 2px 12px">Top Market Drivers</h3>
  <div class="grid cards2">${feedRows}</div>`;
}

/* ---------- Calendar page ---------- */
function renderCalendar(){
  const wl=DATA.watchlist||[];
  const opts=['<option value="ALL">All Stocks</option>'].concat(wl.map(t=>`<option value="${t}">${t}</option>`)).join('');
  const sel = window.__catFilter||'ALL';
  const rows=(DATA.catalysts||[])
    .filter(c=>sel==='ALL'||c.ticker===sel)
    .sort((a,b)=>a.date<b.date?-1:1)
    .map(c=>{const d=pxDate(c.date);
      const typeBadge={'Earnings':'info','FDA/PDUFA':'call','Macro':'wait','Product Launch':'mut'}[c.type]||'mut';
      return `<div class="catrow">
        <div class="date"><div class="d">${d.d}</div><div class="m">${d.m}</div></div>
        <div class="main"><div class="t"><span class="tk">${c.ticker}</span> <span class="badge ${typeBadge}">${c.type}</span> ${impactBadge(c.impact)}</div>
          <div class="setup">${c.setup||''}</div></div>
        <div class="impact"><div class="sub2">Vol impact</div><div><b>${c.vol||'—'}</b></div></div>
      </div>`;}).join('') || `<div class="empty">No catalysts for this filter.</div>`;
  return `<div class="filterbar">
      <label class="sub2">Filter by ticker</label>
      <select id="catFilter">${opts}</select>
      <span class="sub2">${(DATA.catalysts||[]).length} upcoming events</span>
    </div>${rows}`;
}

/* ---------- router + polling ---------- */
const PAGES={portfolio:['Portfolio & Performance','Account summary, open positions and closed-trade ledger',renderPortfolio],
  options:['Options Scanner','Actionable defined-risk setups with live technical context',renderOptions],
  news:["Today's Major News",'Aggregated market drivers, sentiment and breaking alerts',renderNews],
  calendar:['Upcoming Catalyst Calendar','Scheduled earnings, FDA/PDUFA and macro events',renderCalendar]};
let current='portfolio';
function route(to){
  if(!PAGES[to])to='portfolio'; current=to;
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('on',b.dataset.nav===to));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  const [title,sub,fn]=PAGES[to];
  $('#pageTitle').textContent=title; $('#pageSub').textContent=sub;
  const el=$('#page-'+to); el.innerHTML=fn(); el.classList.add('on');
  if(to==='calendar'){ const s=$('#catFilter'); if(s){s.value=window.__catFilter||'ALL'; s.onchange=()=>{window.__catFilter=s.value; route('calendar');};} }
  location.hash=to;
  renderBanner();
}
let bannerDismissed=new Set();
function renderBanner(){
  const el=$('#breakingBanner'); if(!el) return;
  const brk=((DATA.news&&DATA.news.items)||[]).filter(i=>i.breaking && !bannerDismissed.has(i.headline));
  if(!brk.length){ el.hidden=true; el.innerHTML=''; return; }
  const i=brk[0];
  const tks=(i.impact||[]).slice(0,3).map(x=>`${x.ticker} ${x.bias==='bullish'?'+':x.bias==='bearish'?'−':'•'}`).join('  ·  ');
  el.hidden=false;
  el.innerHTML=`<span class="tag">BREAKING</span><span class="htxt">${i.headline}${tks?` — ${tks}`:''}</span><span class="x">Dismiss ✕</span>`;
  el.querySelector('.x').onclick=()=>{ bannerDismissed.add(i.headline); renderBanner(); };
}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>route(b.dataset.nav));

function updateCounts(){
  $('#nav-pos').textContent=(DATA.portfolio?.positions||[]).length;
  $('#nav-opt').textContent=(DATA.options||[]).filter(o=>!o.filtered).length;
  $('#nav-news').textContent=(DATA.news?.items||[]).length;
  $('#nav-cat').textContent=(DATA.catalysts||[]).length;
}
function setLive(ok,src){
  const fresh=(Date.now()-lastFresh)<STALE_MS && ok!==false;
  $('#livedot').className='livedot'+(fresh?'':' stale');
  $('#livechip').className='chip live'+(fresh?'':' stale');
  $('#livetxt').textContent=fresh?'Live':'Stale';
  $('#livechiptxt').textContent=fresh?'LIVE':'STALE';
  $('#livesrc').textContent=src||'';
}
function tickClock(){ $('#clock').textContent=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit',hour12:true}); }

/* Live data: the deployed backend serves ONLY GET /api/spy — the SPY 0DTE payload
   written to MongoDB by the worker (price/vwap/bollinger/gex/options_chain_context/signal).
   mapSpy() maps that real schema onto DATA.technicals / DATA.chain / DATA.spy so the SPY
   tiles and the live signal strip update every 30s. The dashboard STRUCTURE — portfolio,
   option contracts, news, catalysts — always comes from window.DASH_DATA baked at deploy
   time; /api/spy never replaces it. */
function mapSpy(s){
  if(!s || !s.price) return false;
  const pr=s.price||{}, vw=s.vwap||{}, bb=s.bollinger||{}, oc=s.options_chain_context||{}, gx=s.gex||{};
  DATA.technicals=Object.assign({},DATA.technicals||{},{
    spySpot:pr.last, spyDayPct:pr.session_change_pct,
    vwapDelta:vw.price_vs_vwap_pct, bollingerPctB:bb.percent_b});
  if(oc.available){ DATA.technicals.em0dte={low:oc.lower_expected_bound, high:oc.upper_expected_bound, sd:oc.expected_move}; }
  DATA.chain=Object.assign({},DATA.chain||{},{
    atmIV:oc.available?oc.atm_iv:(DATA.chain&&DATA.chain.atmIV),
    pcRatio:oc.available?oc.put_call_ratio:(DATA.chain&&DATA.chain.pcRatio),
    callWall:gx.available?gx.call_wall:null, putWall:gx.available?gx.put_wall:null,
    gammaFlip:gx.available?gx.gamma_flip:null, gexNote:gx.available?null:(gx.reason||'unavailable')});
  DATA.spy={ bias:s.signal&&s.signal.bias, action:s.signal&&s.signal.action,
    conf:s.signal&&s.signal.confluence_score, factors:(s.signal&&s.signal.factors)||[],
    alerts:s.alerts||[], warnings:s.warnings||[], dataSource:s.data_source, updatedEpoch:s.updated_epoch,
    exp:oc['0dte_expiration']};
  return true;
}
async function pollData(){
  let ok=false, fresh=true, src='';
  if(location.protocol!=='file:'){
    try{
      const r=await fetch(API_BASE+'/api/spy',{cache:'no-store'});
      if(r.ok){ const s=await r.json(); if(mapSpy(s)){ ok=true;
        if(s.updated_epoch){ fresh=(Date.now()/1000 - s.updated_epoch) < 300; }
        src='live /api/spy'+(s.data_source?' · '+s.data_source:''); } }
    }catch(e){/* offline / CORS / cold Render — fall back to baked */}
  }
  lastFresh=Date.now();
  if(ok){ updateCounts(); route(current); setLive(fresh,src); return; }
  if(FINNHUB_KEY){ await pollQuotes(); return; }
  setLive(true, DATA.meta&&DATA.meta.mode==='sample'?'sample data':'baked ledger data');
}
async function pollQuotes(){
  try{
    const tks=[...new Set(['SPY',...(DATA.options||[]).map(o=>o.ticker),...(DATA.portfolio?.positions||[]).map(p=>p.ticker)])];
    const qs=await Promise.all(tks.map(t=>fetch('https://finnhub.io/api/v1/quote?symbol='+t+'&token='+FINNHUB_KEY).then(r=>r.json()).catch(()=>null)));
    const map={}; tks.forEach((t,i)=>{ if(qs[i]&&qs[i].c) map[t]=qs[i].c; });
    if(DATA.technicals&&map['SPY']) DATA.technicals.spySpot=map['SPY'];
    (DATA.options||[]).forEach(o=>{ if(map[o.ticker]) o.spot=map[o.ticker]; });
    document.querySelectorAll('[data-spot]').forEach(el=>{ const t=el.getAttribute('data-spot'); if(map[t]) el.textContent=fmt$(map[t]); });
    lastFresh=Date.now(); setLive(true,'Finnhub live quotes');
  }catch(e){ setLive(false,'quote fetch failed'); }
}

// boot
updateCounts();
route((location.hash||'').replace('#','')||'portfolio');
tickClock(); setInterval(tickClock,1000);
pollData(); setInterval(pollData,POLL_MS);
setInterval(()=>setLive(undefined,$('#livesrc').textContent),5000);
</script>
