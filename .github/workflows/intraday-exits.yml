name: Intraday exit engine (1DTE lock / 0DTE force-close)

# Runs the paper exit engine near the US market close so the 1DTE profit-lock and
# 0DTE force-close rules in build_dashboard.update_options() actually fire intraday,
# then re-bakes the dashboard and commits the updated ledger + page.
#
# CAVEATS (read these):
#  * GitHub scheduled runs are frequently 5-15+ min late — this cannot guarantee a
#    fill before a broker's ~3:15pm auto-liquidation. It's a daily near-close run.
#  * cron is UTC with NO DST awareness, so we schedule BOTH the EDT and EST offsets
#    and let the job's ET-time guard decide whether to act (only ~3:00-3:55pm ET).
#  * This is a PAPER ledger; no real broker orders are placed.

on:
  # LEGACY schedule DISABLED by scanner-terminal-research-reset.v1 (2026-08-27) — manual-only (workflow_dispatch). Does not auto-populate the active dashboard.
  workflow_dispatch: {}

concurrency:
  group: intraday-exits
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-exits:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Gate to real New York time (~3:00-3:55pm ET, weekdays)
        id: gate
        run: |
          python3 - <<'PY'
          import os, datetime, zoneinfo
          now = datetime.datetime.now(zoneinfo.ZoneInfo("America/New_York"))
          # Only act on a weekday within the closing window. This absorbs cron drift
          # and makes the four UTC schedules DST-correct: exactly one pair lands here.
          ok = (now.weekday() < 5) and (now.hour == 15 and now.minute <= 55)
          print(f"ET now: {now:%Y-%m-%d %H:%M %Z} weekday={now.weekday()} proceed={ok}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"proceed={'true' if ok else 'false'}\n")
          PY

      - name: Run exit engine + re-bake dashboard
        if: steps.gate.outputs.proceed == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # 1) update_options() marks positions to CBOE bid and applies the 1DTE/0DTE exits
          python3 build_dashboard.py ledger.json _legacy_dashboard.html
          # 2) regenerate the deployed SPA from the freshly-updated ledger
          python3 bake_dashboard.py scanner_dashboard.template.html ledger.json catalysts.json scanner_dashboard.html

      - name: Commit updated ledger + dashboard
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name  "scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ledger.json scanner_dashboard.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "intraday exits: 1DTE lock / 0DTE force-close [skip ci]"
            git pull --rebase --autostash origin main || true
            git push origin main
          fi
