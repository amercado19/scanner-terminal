name: Research Scanner (structural, non-predictive)

# Independent of worker.yml / nightly_scan.yml / intraday-exits.yml.
# Reuses only the repo's free-data technique (CBOE delayed). No secrets needed.
# cron is UTC. These are US market hours on EDT (UTC-4) + one post-close run.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "5 14 * * 1-5"    # ~10:05 ET
    - cron: "5 16 * * 1-5"    # ~12:05 ET
    - cron: "5 18 * * 1-5"    # ~14:05 ET
    - cron: "20 20 * * 1-5"   # ~16:20 ET (post-close)

concurrency:
  group: research-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Structural research scan (CBOE delayed, free)
        run: python3 research-scanner/research_scanner.py --provider cboe --root research-scanner
      - name: Tests (filters + no-prediction invariants)
        run: python3 research-scanner/test_research_scanner.py
      - name: Commit updated research watchlist (ONLY this module's data)
        run: |
          git config user.name "research-scanner-bot"
          git config user.email "research-scanner-bot@users.noreply.github.com"
          git add research-scanner/data/research_watchlist.json
          git commit -m "research-scanner: update watchlist [skip ci]" || echo "no changes"
          git push
