name: Research Scanner (structural, non-predictive)

# Independent of any legacy workflow. Reuses only the repo's free-data technique
# (CBOE delayed). No secrets needed. cron is UTC. These are US market hours on
# EDT (UTC-4) + one post-close run. Builds a permanent historical record:
# active watchlist + monthly archive partitions + archive_index.json.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "5 14 * * 1-5"    # ~10:05 ET
    - cron: "5 16 * * 1-5"    # ~12:05 ET
    - cron: "5 18 * * 1-5"    # ~14:05 ET
    - cron: "20 20 * * 1-5"   # ~16:20 ET (post-close)

concurrency:
  group: research-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Structural research scan (CBOE delayed, free) — appends observations, archives exits
        run: python3 research-scanner/research_scanner.py --provider cboe --root research-scanner
      - name: Tests (filters, no-prediction invariants, historical DB, MFE/MAE, dashboard)
        run: python3 research-scanner/test_research_scanner.py
      - name: Commit updated research record (watchlist + archive partitions + index)
        run: |
          git config user.name "research-scanner-bot"
          git config user.email "research-scanner-bot@users.noreply.github.com"
          git add research-scanner/data
          git commit -m "research-scanner: update historical record [skip ci]" || echo "no changes"
          git push
